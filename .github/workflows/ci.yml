name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: investorkit
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: investorkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U investorkit -d investorkit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://investorkit:ci_only@127.0.0.1:5432/investorkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { randomBytes } from 'node:crypto';
          writeFileSync('.env', `NODE_ENV=test\nDATABASE_URL=${process.env.TEST_DATABASE_URL}\nBETTER_AUTH_SECRET=${randomBytes(48).toString('hex')}\nBETTER_AUTH_URL=http://localhost:5173\nWEB_ORIGIN=http://localhost:5173\n`);
          JS
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
