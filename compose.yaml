services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investorkit
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: investorkit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investorkit -d investorkit"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
